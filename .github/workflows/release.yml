name: release

# A pushed v* tag builds Leme, packages a portable zip and an installer, and
# publishes them as a GitHub release. Run it by hand to build the packages
# without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "dist/leme-${{ steps.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/leme.exe, target/release/pdfium.dll, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          Remove-Item -Recurse $dir

      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer/leme.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          # dpdf 1.1.0 and older update by downloading dpdf-<version>-setup.exe.
          Copy-Item "dist/leme-${{ steps.version.outputs.version }}-setup.exe" "dist/dpdf-${{ steps.version.outputs.version }}-setup.exe"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: leme-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist -File).FullName `
            --title "Leme $env:GITHUB_REF_NAME" --generate-notes
