[package]
name = "dpdf"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal, local-first PDF reader for Windows, built with Rust and Slint."
license = "MIT"
repository = "https://github.com/diegorezm/dpdf"
publish = false

[dependencies]
# raw-window-handle: to color the native title bar from the theme.
slint = { version = "1.18", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
# Native "Open file" dialog.
rfd = "0.18"
# PDF rendering via PDFium; image crate integration not needed.
# Config, themes, and annotations are TOML files users can edit by hand.
serde = { version = "1", features = ["derive"] }
toml = "1.2"
# Copy selected text.
clipboard-win = "5.4"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }

[build-dependencies]
slint-build = "1.18"

# Debug builds still optimize dependencies (Slint, PDFium bindings), so
# `cargo run` scrolls smoothly; our own code stays fast to compile.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
