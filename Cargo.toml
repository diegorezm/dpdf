[package]
name = "dpdf"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal, local-first PDF reader for Windows, built with Rust and Slint."
license = "MIT"
repository = "https://github.com/diegorezm/dpdf"
publish = false

[dependencies]
slint = "1.18"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
