<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leme — documentação</title>
  <link rel="icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="book">
  <nav>
    <a class="brand" href="./"><b>L</b>eme</a>
    <a href="docs.html">Documentação</a>
    <a href="https://github.com/diegorezm/leme">GitHub</a>
  </nav>
  <article id="doc"><p>Loading…</p></article>
  <footer>Generated from the project's <a href="https://github.com/diegorezm/leme/blob/main/DOCS.md">DOCS.md</a>.</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script>
  // The docs are DOCS.md, copied next to this page at deploy time.
  const repo = "https://github.com/diegorezm/leme/blob/main/";
  const doc = document.getElementById("doc");
  fetch("DOCS.md")
    .then((r) => r.text())
    .then((md) => {
      doc.innerHTML = marked.parse(md);
      // Links in DOCS.md are relative to the repo, not to this site.
      for (const a of doc.querySelectorAll("a[href]")) {
        const href = a.getAttribute("href");
        if (!/^(https?:|#)/.test(href)) a.href = repo + href;
      }
      for (const h of doc.querySelectorAll("h2, h3")) {
        h.id = h.textContent.toLowerCase().trim().replace(/\s+/g, "-").replace(/[^\w-]/g, "");
      }
    })
    .catch(() => {
      doc.innerHTML = `<p>Could not load the docs. Read them <a href="${repo}DOCS.md">on GitHub</a>.</p>`;
    });
</script>
</body>
</html>
